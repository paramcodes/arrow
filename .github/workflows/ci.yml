name: CI

on:
  pull_request:
  push:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# The score is the merge gate. It runs pnpm verify, pnpm prove, pnpm test:e2e,
# pnpm build and cargo test once each, and the criterion that failed names the
# command and its output. No step and no job runs an expensive command a second
# time; the end to end suite and the Rust tests live in the score.
#
# One job, one tree, one toolchain: the node side and the Rust side are proved
# in the same run, so a red score is one failure with one criterion behind it.

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # A pull request run proves the tree at its head. The squash merge that
    # lands this tree on main carries the pull request number in its title, so
    # the run on main would prove a tree the pull request run already proved.
    # A direct push to main carries no pull request, so main still proves it.
    if: |
      github.event_name == 'pull_request' ||
      (github.event_name == 'push' && !contains(github.event.head_commit.message, '(#'))

    steps:
      - uses: actions/checkout@v4

      - name: Install the Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            build-essential \
            curl \
            wget \
            file

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - uses: pnpm/action-setup@v4
        with:
          version: 12.9.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: "pnpm install --frozen-lockfile"

      - name: Cache the Playwright browser
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-1.64.1

      - name: Install the Playwright browser
        run: "pnpm exec playwright install --with-deps chromium"

      - name: Prove that the harness can fail
        run: "pnpm prove-harness"

      - name: Score the agent harness
        run: "pnpm harness"
