name: Release

# A tag publishes the Linux bundles. A manual dispatch builds the same bundles
# and keeps them as workflow artifacts, so the build is proved before the first
# tag without publishing a release.
#
# This workflow is separate from ci.yml on purpose: the pull request gate stays
# the one job that scores the harness, and no release step can slow it down.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Check that the version files agree
        run: node scripts/check-version.mjs

      - name: Check that the tag names the version of the files
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          version="$(node -p "require('./apps/desktop/src-tauri/tauri.conf.json').version")"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "the tag ${GITHUB_REF_NAME} does not name the version v${version} of the files" >&2
            exit 1
          fi
          echo "the tag ${GITHUB_REF_NAME} names the version v${version} of the files"

      # The packages below are the list the Requirements section of README.md
      # names, and the list the Tauri v2 shell needs.
      - name: Install the Tauri system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            librsvg2-dev \
            patchelf \
            libxdo-dev \
            libssl-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            build-essential \
            curl \
            wget \
            file

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - uses: pnpm/action-setup@v4
        with:
          version: 12.9.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: "pnpm install --frozen-lockfile"

      - name: Build the AppImage, the deb and the rpm
        working-directory: apps/desktop
        run: pnpm exec tauri build --bundles appimage,deb,rpm --ci

      - name: Keep the bundles as workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: arrow-linux
          if-no-files-found: error
          path: |
            apps/desktop/src-tauri/target/release/bundle/appimage/*.AppImage
            apps/desktop/src-tauri/target/release/bundle/deb/*.deb
            apps/desktop/src-tauri/target/release/bundle/rpm/*.rpm

  release:
    needs: bundle
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          name: arrow-linux
          path: dist

      - name: Collect the bundles, the sizes and the checksums
        run: |
          mkdir -p release
          find dist -type f \( -name '*.AppImage' -o -name '*.deb' -o -name '*.rpm' \) \
            -exec cp {} release/ \;
          cd release
          sha256sum ./*.AppImage ./*.deb ./*.rpm > SHA256SUMS.txt
          {
            echo "Arrow ${GITHUB_REF_NAME}"
            echo
            echo "| File | Size | SHA-256 |"
            echo "| --- | ---: | --- |"
            for file in ./*.AppImage ./*.deb ./*.rpm; do
              name="$(basename "$file")"
              size="$(stat -c %s "$file")"
              hash="$(sha256sum "$file" | cut -d ' ' -f 1)"
              echo "| \`${name}\` | ${size} bytes | \`${hash}\` |"
            done
            echo
            echo "Verify a download with \`sha256sum -c SHA256SUMS.txt\`."
          } > body.md

      - name: Publish the release for the tag
        env:
          GH_TOKEN: ${{ github.token }}
          # The release job has no checkout, so gh learns the repository from
          # the environment instead of a git remote.
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            release/*.AppImage release/*.deb release/*.rpm release/SHA256SUMS.txt \
            --title "Arrow ${GITHUB_REF_NAME}" \
            --notes-file release/body.md
